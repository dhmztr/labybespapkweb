---
apiVersion: v1
kind: Namespace
metadata:
  name: unter
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: unter
type: Opaque
stringData:
  POSTGRES_USER: unter_user
  POSTGRES_PASSWORD: unter_password
  POSTGRES_DB: unter_db
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: unter
type: Opaque
stringData:
  REDIS_PASSWORD: zmien-to-haslo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: unter
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS users (
        id SERIAL PRIMARY KEY,
        email TEXT UNIQUE NOT NULL,
        password_hash TEXT NOT NULL,
        role TEXT DEFAULT 'client',
        is_2fa_enabled BOOLEAN DEFAULT FALSE,
        two_factor_secret TEXT,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS vehicles (
        id SERIAL PRIMARY KEY,
        driver_id INT REFERENCES users(id) ON DELETE SET NULL,
        registration_number TEXT UNIQUE NOT NULL,
        model TEXT NOT NULL,
        status TEXT DEFAULT 'offline'
    );

    CREATE TABLE IF NOT EXISTS rides (
        id SERIAL PRIMARY KEY,
        client_id INT REFERENCES users(id),
        vehicle_id INT REFERENCES vehicles(id),
        pickup_lat DOUBLE PRECISION NOT NULL,
        pickup_lng DOUBLE PRECISION NOT NULL,
        dropoff_lat DOUBLE PRECISION NOT NULL,
        dropoff_lng DOUBLE PRECISION NOT NULL,
        status TEXT DEFAULT 'requested',
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS password_reset_tokens (
        id SERIAL PRIMARY KEY,
        user_id INT NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        token TEXT UNIQUE NOT NULL,
        expires_at TIMESTAMP WITH TIME ZONE NOT NULL,
        used BOOLEAN DEFAULT FALSE
    );

    -- TODO(review): seed usera na sztywno w manifescie wdrazanym zawsze -
    -- reviewer zaproponowal osobny tryb/overlay dev z tym seedem zamiast
    -- deployowania go zawsze. Overlay kustomize (base bez seeda, overlay
    -- dev z tym INSERT-em) to nastepny krok, nie zrobiony w tym komicie.
    INSERT INTO users (email, password_hash, role)
    VALUES (
        'test@mail.pl',
        '$argon2id$v=19$m=65536,t=2,p=1$bW9qYXNvbDEyMzQ1Njc4OQ$EqabBC3aUTPQzQHiNNeb5Dv4ZDj5Z8W4j0QUjN2ksQ8',
        'client'
    ) ON CONFLICT (email) DO NOTHING;

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: unter
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: unter
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: unter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: init-script
          configMap:
            name: postgres-init
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: unter
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: unter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: unter
spec:
  type: NodePort
  selector:
    app: app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: unter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: ghcr.io/dhmztr/labybespapkweb:latest
          imagePullPolicy: Always
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
          envFrom:
            - secretRef:
                name: postgres-credentials
            - secretRef:
                name: redis-credentials
