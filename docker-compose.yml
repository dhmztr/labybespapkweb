version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: unter_postgres
    restart: always
    environment:
      POSTGRES_USER: unter_user
      POSTGRES_PASSWORD: unter_password
      POSTGRES_DB: unter_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: unter_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: