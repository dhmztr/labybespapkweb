name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Logowanie do GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Budowa i push obrazu Dockera
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/dhmztr/labybespapkweb:latest
